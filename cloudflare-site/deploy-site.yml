# Tests and deploys the site to Cloudflare Workers on every push to main.
# Public community site (PUBLIC_SITE=true in wrangler.toml); set it to false to require Cloudflare Access.
name: deploy-site
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-site
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: |
          for f in verify-cloudflare-site.mjs verify-timeline.mjs verify-playback.mjs verify-image-cache.mjs verify-imagery-smoothing.mjs verify-cloud-motion.mjs verify-satellite-times.mjs verify-data-service.mjs verify-indexed-png.mjs verify-terrain.mjs; do node "$f"; done
      - name: Prepare assets
        run: node cloudflare-site/prepare.mjs
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
        run: |
          npx --yes wrangler@4 deploy --config cloudflare-site/wrangler.toml \
            --var "ACCESS_TEAM_DOMAIN:${ACCESS_TEAM_DOMAIN}" --var "ACCESS_AUD:${ACCESS_AUD}"
