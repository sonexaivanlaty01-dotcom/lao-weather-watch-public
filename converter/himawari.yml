# Converts each new Himawari-9 Band 13 observation once and publishes the
# newest five hours as Cloudflare Workers static assets (free, unlimited
# static requests). Triggered precisely by cloudflare/trigger (a free cron
# Worker) about 12 minutes after each observation; the schedule is a fallback.
name: himawari-frames
on:
  workflow_dispatch:
  schedule:
    - cron: '3-59/10 * * * *'
concurrency:
  group: himawari-frames
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Convert new observations and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HIMAWARI_CDN_BASE: ${{ vars.HIMAWARI_CDN_BASE }}
        run: node converter/convert.mjs --deploy --wait 240 --max 31
